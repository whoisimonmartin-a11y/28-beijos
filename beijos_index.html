<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>28 beijos 💋</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;font-family:Georgia,serif;background:#fff5f7;color:#4a2630;display:flex;align-items:center;justify-content:center;padding:24px}
  [hidden]{display:none !important}
  .start{width:min(520px,100%);text-align:center}
  .kiss-button{width:150px;height:150px;border:0;border-radius:50%;background:#b51f3e;color:white;font-size:70px;cursor:pointer;box-shadow:0 16px 35px #b51f3e35;transition:transform .2s,box-shadow .2s}
  .kiss-button:hover{transform:scale(1.06);box-shadow:0 20px 42px #b51f3e45}
  .kiss-button:active{transform:scale(.96)}
  .start-text{margin-top:20px;color:#8b5d67;font:600 15px Arial,sans-serif;letter-spacing:.5px}
  .card{width:min(520px,100%);background:#fff;border:1px solid #f3d5dc;border-radius:28px;padding:38px 28px 30px;text-align:center;box-shadow:0 18px 50px #7b30401a}
  .heart{font-size:42px;animation:pulse 1.7s infinite}
  h1{margin:12px 0 6px;font-size:32px;font-weight:500}
  .subtitle{margin:0 auto 28px;color:#8b5d67;font-family:Arial,sans-serif}
  .counter{font:700 13px Arial,sans-serif;letter-spacing:2px;color:#b45a70;margin-bottom:18px}
  .message{min-height:130px;display:flex;align-items:center;justify-content:center;padding:20px;border-radius:20px;background:#fff5f7;font-size:22px;line-height:1.45;margin-bottom:24px}
  button{border:0;border-radius:999px;padding:15px 25px;background:#b84d68;color:white;font:700 15px Arial,sans-serif;cursor:pointer;box-shadow:0 8px 20px #b84d6830}
  button:active{transform:scale(.97)}
  .hint{font:12px Arial,sans-serif;color:#a47b84;margin-top:18px}
  @keyframes pulse{50%{transform:scale(1.12)}}
</style>
</head>
<body>
<section class="start" id="startScreen">
  <button class="kiss-button" id="startButton" aria-label="Abrir os 28 beijos">💋</button>
  <p class="start-text">Clique no beijo</p>
</section>

<main class="card" id="kissPage" hidden>
  <div class="heart">💋</div>
  <h1>28 anos, 28 beijos</h1>
  <p class="subtitle">Eu te beijaria até meus lábios caírem, eternamente</p>
  <div class="counter" id="counter">BEIJO 1 DE 28</div>
  <div class="message" id="message">“Eu beijo suas bochechas, pois amo a forma como se avermelham quando te elogio como merece.”</div>
  <button id="next">💋 Quero outro beijo</button>
  <div class="hint">Clique para descobrir o próximo.</div>
</main>
<script>
document.getElementById("startButton").onclick = () => {
  document.getElementById("startScreen").hidden = true;
  document.getElementById("kissPage").hidden = false;
};

const mensagens = [
  "Eu beijo suas bochechas, pois amo a forma como se avermelham quando te elogio como merece.",
  "Eu beijo sua testa, pois amo segurar teu rosto em minhas mãos e demonstrar proteção.",
  "Eu beijo a ponta do seu nariz, pois assim posso te olhar bem de pertinho nos olhos.",
  "Eu beijo os teus olhos, pois são a mais bela porta do universo que já tive o privilégio de admirar.",
  "Eu beijo as suas orelhas, para sussurrar que eu te amo entre cada beijo.",
  "Eu beijo o seu queixo, pois me lembra de quando ainda nos amávamos em segredo.",
  "Eu beijo abaixo do seu nariz, pois se aproxima dos deus lábios e cada detalhe do seu rosto merece ser admirado.",
  "Eu beijo o canto de sua boca, pois é 1/3 cada vez mais próximo do paraíso",
  "Eu beijo seus cabelos, pois possuem a maciez das Pétalas que tanto ama.",
  "Eu beijo a sua nuca, te abraçando por trás, para que você não escape dos meus braços.",
  "Eu beijo seu pescoço, cada centimetro. Enterro meu rosto nele e me deixo inebriar pelo meu aroma favorito no mundo inteiro, o seu.",
  "Eu beijo seus ombros e deito meu rosto ali para descansar, pois você é meu porto seguro.",
  "Eu beijo seu peito, onde está seu coração, que é onde pertenço.",
  "Eu beijo sua barriga, para cuidar das pequenas borboletas que vivem nela.",
  "Eu beijo seus braços, mil beijos por cada braço, para que cada novo abraço que eu receba de você seja ainda mais amoroso.",
  "Eu beijo as costas de suas mãos, pois você é minha princesa.",
  "Eu beijo a palma de suas mãos, pois você me tem nelas, sempre.",
  "Eu beijo seus dedos, da base até a ponta, pois são lindos e perfeitamente moldados para de encaixarem nos meus.",
  "Eu beijo especificamente o seu mindinho, para proteger e revalidar todas as nossas promessas já feitas.",
  "Eu beijo seu anelar, o qual carrega um dos simbolos do nosso amor.",
  "Eu beijo suas coxas, macias e esbeltas, que me encantam desde a primeira vez que nos deitamos juntos e perguntei se poderia acaricia-las, ainda sem compreender meus sentimentos.",
  "Eu beijo suas canelas, como uma ponte que me leva ao abismo dos teus pés.",
  "Eu beijo teus pés, onde fico por você sempre.",
  "Eu beijo sua virilha, sua bunda. Íntimo, assim como nós.",
  "Eu beijo suas costas, da sua nuca até o fim da coluna, mil beijos delicados e molhados por cada pedaço de pele e me declaro, ao pé do seu ouvido, dizendo que sou seu eternamente.",
  "Eu beijo sua cintura, como um cinturão de beijos, pois é o local onde meus braços moram e se encaixam perfeitamente.",
  "Eu beijo sua boca. Ah, sua boca. Dentre todos os centimetros que amo beijar de cada parte de você, sua boca é ainda, e sempre, a parte que me leva aos céus. Quando te beijo, em seus lábios, sinto que também beijo sua alma e entrego a minha a você. Cada beijo nosso possui uma carga densa, cada vez mais intensa, não importa o intervalo em que aconteçam. Sempre em cada minimo resvalar de lábios, serei atraido para ter cada vez mais dos teus e me afundar em nosso mar de beijos intermináveis e insaciáveis. Isso nunca mudou, eu te beijaria até meus lábios cairem, mas espero que não caiam, pois assim eu perderia a chance de te beijar ainda mais e mais.",
  "Eu te beijo, porque eu te amo incontrolávelmente, de maneira que ninguém no mundo jamais entenderia, apenas você, eternamente."
];
let i=0;
const message=document.getElementById("message");
const counter=document.getElementById("counter");
document.getElementById("next").onclick=()=>{
  i=(i+1)%mensagens.length;
  message.textContent="“"+mensagens[i]+"”";
  counter.textContent=`BEIJO ${i+1} DE 28`;
};
</script>
</body>
</html>
